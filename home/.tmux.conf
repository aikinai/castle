# ~/.tmux.conf

# ┌───────────────────────────────────────────────────────────────────┐
# │ CORE BEHAVIOR                                                     │
# └───────────────────────────────────────────────────────────────────┘
# Change prefix from C-b to C-a.
set -g prefix C-a
bind C-a send-prefix

# Increase history limit.
set -g history-limit 10000

# Set vi-style keys for copy mode.
# Note: `status-keys vi` is handled by tmux-sensible.
setw -g mode-keys vi

# ┌───────────────────────────────────────────────────────────────────┐
# │ KEYBINDINGS                                                       │
# └───────────────────────────────────────────────────────────────────┘
# Pane navigation with vi keys.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Split panes using | and -.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pressing C-a twice cycles to the last active window.
bind C-a last-window

# ┌───────────────────────────────────────────────────────────────────┐
# │ MOUSE & COPY MODE                                                 │
# └───────────────────────────────────────────────────────────────────┘
# Enable mouse support.
setw -g mouse on

# Smart wheel scrolling:
# - App requested mouse tracking (Grok, vim, less -m, …) → pass wheel to the app
# - Already in copy-mode → keep scrolling tmux history
# - Plain shell / normal output → enter copy-mode and scroll history
# (The old always-on binds forced copy-mode and stole scroll from fullscreen TUIs.)
bind -n WheelUpPane {
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" {
        send-keys -M
    } {
        select-pane -t=
        copy-mode -e
        send-keys -M
    }
}
bind -n WheelDownPane {
    if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" {
        send-keys -M
    } {
        select-pane -t=
        send-keys -M
    }
}

# Configure vi-style visual selection in copy mode.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Set tmux to automatically broadcast buffer content to the system clipboard.
# This is the key to making the remote copy work automatically.
set -g set-clipboard on

# Smart keybinding for 'y' (yank).
# When remote (in SSH), `copy-selection-and-cancel` copies to the tmux buffer,
# which `set-clipboard on` then automatically sends to the local clipboard.
# When local, it pipes directly to pbcopy.
if-shell '[ -n "$SSH_TTY" ]' \
    'unbind -T copy-mode-vi y; bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel' \
    'unbind -T copy-mode-vi y; bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"'

# ┌───────────────────────────────────────────────────────────────────┐
# │ TERMINAL & COLORS                                                 │
# └───────────────────────────────────────────────────────────────────┘
# Set the default terminal to advertise 256-color support.
set -g default-terminal "tmux-256color"

# Truecolor for any attached client (comma is the feature-list separator;
# `*:RGB` alone would be misparsed). Fixes washed-out themes in Grok/etc.
set -as terminal-features ",*:RGB"

# Let OSC 52 / cursor-style / other DCS sequences pass through to the outer
# terminal (needed for clipboard and modern TUIs inside tmux).
set -wg allow-passthrough on

# Extended keys so modified Enter chords (Ctrl/Shift+Enter) reach apps.
set -g extended-keys on

# ┌───────────────────────────────────────────────────────────────────┐
# │ UI & STATUS BAR                                                   │
# └───────────────────────────────────────────────────────────────────┘
# Set status bar position and refresh interval.
set -g status-position bottom
set -g status-interval 2

# Set status bar lengths to prevent truncation.
set -g status-left-length 60
set -g status-right-length 120

# Format the current window tab to show index and name (e.g., "1* zsh").
setw -g window-status-current-format '#[bold]#I* #W'

# ┌───────────────────────────────────────────────────────────────────┐
# │ TPM (TMUX PLUGIN MANAGER)                                         │
# └───────────────────────────────────────────────────────────────────┘
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' # Provides sane defaults
set -g @plugin 'jimeh/tmux-themepack'       # UI themes

# Configure the theme from tmux-themepack.
set -g @themepack 'powerline/default/green'

# Initialize TPM. This MUST be the last line in the config.
run -b "$HOME/.tmux/plugins/tpm/tpm"
